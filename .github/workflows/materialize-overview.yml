name: Materialize overview artwork

on:
  push:
    branches: [ui/final-0.1.1-assets]
    paths:
      - .github/workflows/materialize-overview.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ui/final-0.1.1-assets

      - name: Detect staged artwork
        id: staged
        shell: bash
        run: |
          if test -f .asset-staging/overview.b64; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode staged artwork
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          tr -cd 'A-Za-z0-9+/=' < .asset-staging/overview.b64 | base64 --decode > media/universal-dictate-overview.webp
          test "$(head -c 4 media/universal-dictate-overview.webp)" = "RIFF"
          test "$(dd if=media/universal-dictate-overview.webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          file media/universal-dictate-overview.webp

      - name: Commit binary artwork
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .asset-staging
          git add media/universal-dictate-overview.webp
          git commit -m "Add Universal Dictate overview artwork"
          git push origin HEAD:ui/final-0.1.1-assets
