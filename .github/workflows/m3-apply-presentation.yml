name: M3 apply presentation edits (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/m3-apply-presentation.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'gcalpay/vscode-universal-dictate' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/live-transcript-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact locally reviewed file postimages
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          branch = 'feat/live-transcript-preview'
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == os.environ['EXPECTED_HEAD']
          assert not git('status', '--porcelain')
          patch = Path('.github/m3-presentation-edits.patch').read_bytes().replace(b'\n diff --git ', b'\ndiff --git ')
          assert hashlib.sha256(patch).hexdigest() == 'c608920a8756235958d50725f0e695371f7f988dae8e6b8944578b74725c78fd'
          expected = {
              'AGENTS.md': '46252ee149226bd24003c4656a922d19b7657551',
              'docs/DICTATION_RELIABILITY_PLAN.md': '2087c90d32a27c7049546869e397ed211777d77c',
              'native/record-audio.cpp': '8b2f7b92f7eefb57e50782d34b5c527f5f0945b3',
              'src/core/preview-recorder.ts': '718de27327b321d9c224e9fbb5e7ffb5bbd3a88b',
              'test/preview-recorder.test.cjs': 'b65ff5ca88a9a998aa2e587794b27566a59c1570'
          }
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(expected)
          for path, sha in expected.items():
              assert git('hash-object', path) == sha, path
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == os.environ['EXPECTED_HEAD']
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'feat(m3): refine fixed-size multilingual preview presentation'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          print('Committed exact reviewed presentation postimages:', git('rev-parse', 'HEAD'))
          PY
