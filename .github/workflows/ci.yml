name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Compile
        run: npm run compile

      - name: Overlay-size TypeScript tests
        run: node --test test/overlay-size.test.cjs

      - name: M2 recovery, clipboard and lifecycle tests
        run: node --test test/transcript-recovery.test.cjs test/transcript-recovery-ui.test.cjs test/text-input.test.cjs test/lifecycle.test.cjs test/recorder-lifecycle.test.cjs

      - name: Unicode input policy tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic test/native/unicode-input-test.cpp -o .deps-unicode-input-test
          ./.deps-unicode-input-test

      - name: Overlay layout geometry test
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic test/native/overlay-layout-test.cpp -o overlay-layout-test
          ./overlay-layout-test

  codacy-public-report:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 51
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Retrieve public Codacy report without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'https://api.codacy.com/api/v3/analysis/organizations/gh/gcalpay/repositories/vscode-universal-dictate/pull-requests/51'
          # Read-only public endpoints. No tokens, checkout, installs, or mutations.
          for suffix in ('', '/issues?limit=100', '/issues?limit=100&issueType=New'):
              url = base + suffix
              request = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'Universal-Dictate-M2-review'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      raw = response.read(1048577)
                  if len(raw) > 1048576:
                      raise ValueError('response exceeds review bound')
                  text = raw.decode('utf-8')
                  try:
                      payload = json.loads(text)
                  except ValueError:
                      payload = text[:2000]
                  print(json.dumps({'url': url, 'status': status, 'response': payload}, ensure_ascii=True))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'url': url, 'status': error.code, 'error': error.read(2000).decode('utf-8', errors='replace')}))
              except Exception as error:
                  print(json.dumps({'url': url, 'error': str(error)}))
          PY
