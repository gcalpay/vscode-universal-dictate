name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Compile
        run: npm run compile

      - name: Complete Node regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deps
          npm run compile
          node --unhandled-rejections=strict --test test/*.test.cjs test/visualizations/*.test.cjs | tee .deps/node-tests.log

      - name: Upload Node test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: node-tests-${{ runner.os }}
          path: .deps/node-tests.log
          if-no-files-found: warn
          retention-days: 30

      - name: Recorder command stream flush ownership
        run: |
          mkdir -p .deps
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic test/native/recorder-streams-test.cpp -o .deps/recorder-streams-test
          .deps/recorder-streams-test

      - name: Concurrent capture pause gate
        run: |
          mkdir -p .deps
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread test/native/recording-pause-test.cpp -o .deps/recording-pause-test
          .deps/recording-pause-test

      - name: Unicode input policy tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic test/native/unicode-input-test.cpp -o .deps-unicode-input-test
          ./.deps-unicode-input-test

      - name: Overlay layout geometry test
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic test/native/overlay-layout-test.cpp -o overlay-layout-test
          ./overlay-layout-test

      - name: Bounded native PCM and protocol tests
        run: |
          mkdir -p .deps
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread test/native/preview-buffer-test.cpp -o .deps/preview-buffer-test
          .deps/preview-buffer-test
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread test/native/preview-bridge-test.cpp -o .deps/preview-bridge-test
          .deps/preview-bridge-test
          node --unhandled-rejections=strict test/preview-native-ipc.cjs ./.deps/preview-bridge-test

      - name: Fixed signed-peak waveform scale
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic test/native/waveform-level-test.cpp -o .deps/waveform-level-test
          .deps/waveform-level-test

      - name: Immutable waveform history and scrolling
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread test/native/waveform-history-test.cpp -o .deps/waveform-history-test
          .deps/waveform-history-test
          g++ -std=c++20 -DNDEBUG -Wall -Wextra -Werror -pedantic test/native/waveform-level-test.cpp -o .deps/waveform-level-ndebug-test
          .deps/waveform-level-ndebug-test

      - name: Preview geometry regression
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic test/native/preview-layout-test.cpp -o .deps/preview-layout-test
          .deps/preview-layout-test

      - name: Spectral transforms, history, pause and layout regressions
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -pthread test/native/spectral-visualizer-test.cpp -o .deps/spectral-visualizer-test
          .deps/spectral-visualizer-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic test/native/spectral-benchmark.cpp -o .deps/spectral-benchmark
          .deps/spectral-benchmark .deps/spectral-benchmark.json

      - name: Upload synthetic spectral cost report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spectral-linux-benchmark
          path: .deps/spectral-benchmark.json
          if-no-files-found: error
          retention-days: 14
