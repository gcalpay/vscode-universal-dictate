name: M7 detail source snapshot (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feat/pause-resume-controls' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source and identity
        run: |
          mkdir -p /tmp/ud-detail-source
          git archive HEAD > /tmp/ud-detail-source/source.tar
          git rev-parse HEAD > /tmp/ud-detail-source/source-sha.txt
          git rev-parse HEAD^{tree} > /tmp/ud-detail-source/tree-sha.txt
          cd /tmp/ud-detail-source
          sha256sum source.tar > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: m7-detail-source
          path: /tmp/ud-detail-source/*
          retention-days: 7
