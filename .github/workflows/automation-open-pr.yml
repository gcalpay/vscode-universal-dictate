name: Automation PR Handoff

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: Feature branch to hand off for review
        required: true
        type: string
      base_branch:
        description: PR base branch
        required: true
        default: main
        type: string
      pr_title:
        description: Pull request title
        required: true
        type: string
      pr_body:
        description: Pull request body
        required: true
        type: string
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  open-pr:
    name: Record handoff and open PR as gcalpay-automation
    if: >-
      github.actor == 'gcalpay' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[automation-handoff]')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Resolve and validate request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_HEAD_BRANCH: ${{ inputs.head_branch }}
          DISPATCH_BASE_BRANCH: ${{ inputs.base_branch }}
          DISPATCH_PR_TITLE: ${{ inputs.pr_title }}
          DISPATCH_PR_BODY: ${{ inputs.pr_body }}
          PUSH_BRANCH: ${{ github.ref_name }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            head="$DISPATCH_HEAD_BRANCH"
            base="$DISPATCH_BASE_BRANCH"
            title="$DISPATCH_PR_TITLE"
            body="$DISPATCH_PR_BODY"
            trigger_mode='manual workflow_dispatch fallback'
          else
            head="$PUSH_BRANCH"
            base='main'
            first_line="${PUSH_MESSAGE%%$'\n'*}"
            marker=' [automation-handoff]'
            if [[ "$first_line" != *"$marker" ]]; then
              echo "Automatic handoff marker must appear at the end of the commit subject." >&2
              exit 1
            fi
            title="${first_line%$marker}"
            body="Automated handoff from \`$head\` after a maintainer-approved gate. Review the complete branch diff and CI/check status before merge."
            trigger_mode='automatic push marker'
          fi

          branch_pattern='^[A-Za-z0-9._/-]+$'
          if [[ ! "$head" =~ $branch_pattern ]]; then
            echo "Invalid head branch: $head" >&2
            exit 1
          fi
          if [[ ! "$base" =~ $branch_pattern ]]; then
            echo "Invalid base branch: $base" >&2
            exit 1
          fi
          if [[ "$head" == "$base" || "$head" == "main" ]]; then
            echo "Refusing to create a PR from the base/default branch." >&2
            exit 1
          fi
          if [[ -z "$title" || -z "$body" ]]; then
            echo "PR title and body must not be empty." >&2
            exit 1
          fi

          {
            echo "head_branch=$head"
            echo "base_branch=$base"
            echo "pr_title=$title"
            echo "trigger_mode=$trigger_mode"
            echo 'pr_body<<__AUTOMATION_PR_BODY__'
            printf '%s\n' "$body"
            echo '__AUTOMATION_PR_BODY__'
          } >> "$GITHUB_OUTPUT"

      - name: Check out feature branch as automation account
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.request.outputs.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_BOT_TOKEN }}

      - name: Verify automation identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_BOT_TOKEN }}
        run: |
          set -euo pipefail
          login="$(gh api user --jq .login)"
          if [[ "$login" != "gcalpay-automation" ]]; then
            echo "AUTOMATION_BOT_TOKEN belongs to '$login', expected 'gcalpay-automation'." >&2
            exit 1
          fi

      - name: Refuse duplicate open PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_BOT_TOKEN }}
          HEAD_BRANCH: ${{ steps.request.outputs.head_branch }}
          BASE_BRANCH: ${{ steps.request.outputs.base_branch }}
        run: |
          set -euo pipefail
          existing="$(gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f head="gcalpay:$HEAD_BRANCH" \
            -f base="$BASE_BRANCH" \
            --jq 'length')"
          if [[ "$existing" != "0" ]]; then
            echo "An open PR already exists from $HEAD_BRANCH to $BASE_BRANCH." >&2
            exit 1
          fi

      - name: Record automated handoff
        shell: bash
        env:
          HEAD_BRANCH: ${{ steps.request.outputs.head_branch }}
          BASE_BRANCH: ${{ steps.request.outputs.base_branch }}
          TRIGGER_MODE: ${{ steps.request.outputs.trigger_mode }}
        run: |
          set -euo pipefail

          log='docs/issue-38-implementation-log.md'
          if [[ ! -f "$log" ]]; then
            echo "$log is missing; refusing to create untracked bookkeeping elsewhere." >&2
            exit 1
          fi

          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            printf '\n### Automated PR handoff — %s\n\n' "$timestamp"
            printf -- '- Automation account: `gcalpay-automation`\n'
            printf -- '- Head: `%s`\n' "$HEAD_BRANCH"
            printf -- '- Base: `%s`\n' "$BASE_BRANCH"
            printf -- '- Trigger: %s\n' "$TRIGGER_MODE"
            printf -- '- Triggered by maintainer: `%s`\n' "$GITHUB_ACTOR"
          } >> "$log"

          git config user.name 'gcalpay-automation [bot]'
          git config user.email '315580681+gcalpay-automation@users.noreply.github.com'
          git add "$log"
          git commit -m 'Record automated PR handoff'
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Open pull request and request maintainer review
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_BOT_TOKEN }}
          HEAD_BRANCH: ${{ steps.request.outputs.head_branch }}
          BASE_BRANCH: ${{ steps.request.outputs.base_branch }}
          PR_TITLE: ${{ steps.request.outputs.pr_title }}
          PR_BODY: ${{ steps.request.outputs.pr_body }}
        run: |
          set -euo pipefail

          pr_number="$(gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="$PR_TITLE" \
            -f head="$HEAD_BRANCH" \
            -f base="$BASE_BRANCH" \
            -f body="$PR_BODY" \
            --jq '.number')"

          printf '{"reviewers":["gcalpay"]}' | gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/pulls/$pr_number/requested_reviewers" \
            --input - >/dev/null

          echo "Opened https://github.com/$GITHUB_REPOSITORY/pull/$pr_number"
