name: M3 apply reviewed source (temporary)

on:
  pull_request:
    paths: ['.github/workflows/m3-apply-reviewed.yml']

permissions:
  contents: read

jobs:
  apply-reviewed:
    if: github.repository == 'gcalpay/vscode-universal-dictate' && github.head_ref == 'feat/live-transcript-preview' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply only the hash-verified reviewed patch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, tempfile
          from pathlib import Path, PurePosixPath
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD'], 'checkout mismatch'
          assert not git('status', '--porcelain'), 'checkout has unrelated changes'
          encoded = ''.join((Path('.deps/m3-integration-data') / ('part' + str(i))).read_text() for i in range(5))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '069335b500195b2e34c6d55a9bd9a83875e5dbc0f768f262727668532890a0c7', 'payload mismatch'
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          raw = decoder.decompress(compressed, max_length=1024 * 1024)
          assert decoder.eof and not decoder.unused_data, 'invalid or oversized payload'
          payload = json.loads(raw)
          assert set(payload) == {'patch', 'pre', 'post'}
          assert set(payload['pre']) == set(payload['post']) and len(payload['post']) == 31
          for name, before in payload['pre'].items():
              rel = PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts
              assert name in {'AGENTS.md', 'README.md', 'package.json'} or rel.parts[0] in {'src', 'native', 'test', 'docs'}
              path = Path(name)
              assert not path.is_symlink()
              if before is None:
                  assert not path.exists(), 'new path already exists: ' + name
              else:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == before, 'preimage mismatch: ' + name
          with tempfile.TemporaryDirectory(prefix='m3-reviewed-') as temp:
              patch = Path(temp) / 'reviewed.patch'
              patch.write_text(payload['patch'], encoding='utf-8')
              subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
              subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(payload['post']), 'unexpected changed paths'
          for name, after in payload['post'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == after, 'postimage mismatch: ' + name
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git', 'commit', '-m', 'feat(m3): integrate opt-in recording preview'], check=True)
          remote = git('ls-remote', 'origin', 'refs/heads/feat/live-transcript-preview').split()[0]
          assert remote == os.environ['EXPECTED_HEAD'], 'branch advanced; refusing overwrite'
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feat/live-transcript-preview'], check=True)
          print('REVIEWED_SOURCE_COMMIT=' + git('rev-parse', 'HEAD'))
          print('REVIEWED_SOURCE_TREE=' + git('rev-parse', 'HEAD^{tree}'))
          PY
