name: Windows package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Compile native Windows paste helper
        shell: cmd
        run: |
          if not exist resources\bin mkdir resources\bin
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 native\windows-fast-paste.c /Fe:resources\bin\windows-fast-paste.exe user32.lib

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: universal-dictate-windows-dev
          path: universal-dictate-dev.vsix
          if-no-files-found: error
