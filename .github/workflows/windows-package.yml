name: Windows package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install extension dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Overlay-size TypeScript tests
        run: npm run test:m1

      - name: M2 recovery, clipboard and lifecycle tests
        run: node --test test/transcript-recovery.test.cjs test/transcript-recovery-ui.test.cjs test/text-input.test.cjs test/lifecycle.test.cjs test/recorder-lifecycle.test.cjs

      - name: M3 preview scheduling and PCM snapshot tests
        run: node --unhandled-rejections=strict --test test/preview-pipeline.test.cjs test/preview-recorder.test.cjs test/preview-runtime.test.cjs

      - name: M7 pause/resume state and command tests
        run: node --unhandled-rejections=strict --test test/pause-controls.test.cjs

      - name: Fetch pinned miniaudio header
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .deps/miniaudio | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/mackron/miniaudio/0.11.25/miniaudio.h -OutFile .deps/miniaudio/miniaudio.h

      - name: Compile native Windows helpers and test executables
        id: native_build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $vsInstall = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vsInstall) {
            throw "No Visual Studio installation with the C++ toolchain was found"
          }

          $vcvars = Join-Path $vsInstall 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }

          $commands = @(
            "call `"$vcvars`"",
            "if not exist resources\bin mkdir resources\bin",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc native\windows-text-input.cpp /Fe:resources\bin\windows-text-input.exe user32.lib",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc /I .deps\miniaudio native\record-audio.cpp native\miniaudio-impl.cpp /Fe:resources\bin\universal-dictate-recorder.exe user32.lib gdi32.lib",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc test\native\recording-pause-test.cpp /Fe:.deps\recording-pause-test.exe",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc /I .deps\miniaudio test\native\recorder-pause-capture-test.cpp native\miniaudio-impl.cpp /Fe:.deps\recorder-pause-capture-test.exe user32.lib gdi32.lib",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc test\native\overlay-layout-test.cpp /Fe:.deps\overlay-layout-test.exe",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc test\native\preview-layout-test.cpp /Fe:.deps\preview-layout-test.exe",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc /I .deps\miniaudio test\native\preview-presentation-test.cpp native\miniaudio-impl.cpp /Fe:.deps\preview-presentation-test.exe user32.lib gdi32.lib",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc test\native\unicode-input-test.cpp /Fe:.deps\unicode-input-test.exe",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc test\native\text-input-request-test.cpp /Fe:.deps\text-input-request-test.exe user32.lib gdi32.lib",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc test\native\text-input-windows-test.cpp /Fe:.deps\text-input-windows-test.exe user32.lib gdi32.lib",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc test\native\preview-buffer-test.cpp /Fe:.deps\preview-buffer-test.exe",
            "cl /nologo /utf-8 /O2 /std:c++20 /EHsc test\native\preview-bridge-test.cpp /Fe:.deps\preview-bridge-test.exe"
          ) -join ' && '

          cmd.exe /D /S /C $commands
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Pause gate, production PCM capture and actual Node pause pipe
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          & .deps/recording-pause-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .deps/recorder-pause-capture-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --unhandled-rejections=strict test/pause-native-ipc.cjs .deps/recorder-pause-capture-test.exe
          exit $LASTEXITCODE

      - name: Native overlay layout regression
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 2
        run: |
          & .deps/overlay-layout-test.exe
          exit $LASTEXITCODE

      - name: Native Unicode input policy tests
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 2
        run: |
          & .deps/unicode-input-test.exe
          exit $LASTEXITCODE

      - name: Win32 request and lifetime-pipe tests
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 2
        run: |
          & .deps/text-input-request-test.exe
          exit $LASTEXITCODE

      - name: Win32 direct input and untouched clipboard tests
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          # Sends real text to its own scratch EDIT and seeds a disposable clipboard fixture.
          & .deps/text-input-windows-test.exe --allow-disposable-desktop-input
          exit $LASTEXITCODE

      - name: Native PCM, preview protocol and actual Node IPC
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          & .deps/preview-buffer-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .deps/preview-bridge-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --unhandled-rejections=strict test/preview-native-ipc.cjs .deps/preview-bridge-test.exe
          exit $LASTEXITCODE

      - name: Native preview presentation, clipping and non-activation
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          & .deps/preview-layout-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .deps/preview-presentation-test.exe --allow-disposable-desktop .deps/preview-presentation
          exit $LASTEXITCODE

      - name: Upload scripted production-renderer images
        if: ${{ always() && steps.native_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: m3-preview-presentation
          path: .deps/preview-presentation/*.bmp
          if-no-files-found: warn
          retention-days: 14

      - name: Fetch pinned whisper.cpp Windows runtime
        shell: pwsh
        run: |
          $version = '1.9.1'
          $expectedSha256 = '7d8be46ecd31828e1eb7a2ecdd0d6b314feafd82163038ab6092594b0a063539'
          $zip = '.deps/whisper-bin-x64.zip'
          $extract = '.deps/whisper-runtime'
          $url = "https://github.com/ggml-org/whisper.cpp/releases/download/v$version/whisper-bin-x64.zip"

          Invoke-WebRequest $url -OutFile $zip
          $actualSha256 = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "whisper.cpp runtime checksum mismatch: $actualSha256"
          }

          Expand-Archive -Path $zip -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force resources/whisper | Out-Null
          Copy-Item "$extract/Release/*" resources/whisper/ -Recurse -Force

          if (-not (Test-Path resources/whisper/whisper-cli.exe)) {
            throw 'whisper-cli.exe was not found in the pinned runtime archive'
          }
          if (-not (Test-Path resources/whisper/whisper-server.exe)) {
            throw 'whisper-server.exe was not found in the pinned runtime archive'
          }

      - name: Measure real Node preview adapter (synthetic speech, no microphone)
        if: github.head_ref == 'feat/live-transcript-preview' || github.head_ref == 'release/next' || github.head_ref == 'feat/pause-resume-controls'
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin' -OutFile .deps/ggml-base.bin
          if ((Get-FileHash .deps/ggml-base.bin -Algorithm SHA256).Hash.ToLowerInvariant() -ne '60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe') { throw 'Model checksum mismatch' }
          Add-Type -AssemblyName System.Speech
          $synth = [System.Speech.Synthesis.SpeechSynthesizer]::new()
          try {
            $voice = $synth.GetInstalledVoices() | Where-Object { $_.Enabled -and $_.VoiceInfo.Culture.Name.StartsWith('en-') } | Select-Object -First 1
            if (-not $voice) { throw 'Synthetic English voice unavailable' }
            $synth.SelectVoice($voice.VoiceInfo.Name)
            $format = [System.Speech.AudioFormat.SpeechAudioFormatInfo]::new(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
            $synth.SetOutputToWaveFile((Join-Path $pwd '.deps/preview-fixture.wav'), $format)
            $synth.Speak(('This is a synthetic test of local dictation. The pump pressure is five bar, and the water temperature is twenty degrees. Do not submit the message. We are checking whether provisional words remain responsive during a longer recording. ' * 4))
            $synth.SetOutputToNull()
          } finally { $synth.Dispose() }
          node test/preview/runtime-benchmark.cjs resources/whisper/whisper-server.exe .deps/ggml-base.bin .deps/preview-fixture.wav .deps/preview-adapter-results.json
          exit $LASTEXITCODE

      - name: Upload Node preview timing evidence
        if: ${{ always() && (github.head_ref == 'feat/live-transcript-preview' || github.head_ref == 'release/next' || github.head_ref == 'feat/pause-resume-controls') }}
        uses: actions/upload-artifact@v7
        with:
          name: m3-preview-adapter-results
          path: .deps/preview-adapter-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Package win32-x64 VSIX
        shell: pwsh
        run: |
          # Pin README images/links to the actual built commit, not moving HEAD.
          # This also makes the unpublished candidate's new screenshots viewable.
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'Cannot determine package source commit'
          }
          npm run package:vsix -- --baseContentUrl "https://github.com/gcalpay/vscode-universal-dictate/blob/$sourceCommit/" --baseImagesUrl "https://raw.githubusercontent.com/gcalpay/vscode-universal-dictate/$sourceCommit/"
          exit $LASTEXITCODE

      - name: Inspect packaged VSIX contents and build identity
        shell: pwsh
        run: |
          & ./test/inspect-vsix.ps1 -Path universal-dictate-win32-x64.vsix -ReportPath .deps/vsix-inspection.json

      - name: Upload win32-x64 VSIX
        uses: actions/upload-artifact@v7
        with:
          name: universal-dictate-win32-x64
          path: |
            universal-dictate-win32-x64.vsix
            .deps/vsix-inspection.json
          if-no-files-found: error
